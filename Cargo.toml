[package]
name = "banco-valmed"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Banco ValMed: banco simulado con cobros por QR dinámico (sin dinero real)"

[dependencies]
# Web
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false }

# Datos
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }

# Seguridad
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"

# QR
qrcode = { version = "0.14", default-features = false, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Avisos (webhooks)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Infraestructura
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[profile.release]
strip = true
